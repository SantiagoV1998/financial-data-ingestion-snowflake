# Machine-readable project metadata.
# Kept in sync with knowledge-base/README.md on every PR.

project:
  name: financial-data-ingestion-snowflake
  type: technical-exercise
  repository: https://github.com/SantiagoV1998/financial-data-ingestion-snowflake
  description: >
    Multi-format financial transaction ingestion (XML, JSON, CSV) into a
    canonical medallion model on Snowflake, using SQL only.

constraints:
  - id: sql-only
    statement: No Python, no external ETL tooling. Every transformation is SQL.
  - id: sources-untouched
    statement: >
      Source files are committed byte-identical to delivery. All repair happens
      inside Snowflake.

platform:
  warehouse: snowflake
  connection: nuaav              # ~/.snowflake/config.toml
  auth: rsa-key-pair             # ~/.snowflake/keys/ — never committed
  database: financial_ingestion
  compute: wh_ingestion          # XSMALL, auto-suspend 60s
  role: ingestion_engineer       # owns everything; ACCOUNTADMIN only bootstraps
  schemas: [bronze, silver, gold]

sources:
  clients:
    - code: CLIENT_A
      path: data/client_a
      files: 10
      transaction_format: xml
      notes: >
        Seven XML fragments with unbalanced root tags; file 4 is XML with a .txt
        extension. Payment embedded in each transaction; no payments file.
    - code: CLIENT_B
      path: data/client_b
      files: 5
      transaction_format: json
      notes: >
        Folder named "Client B" but contents identify as clientC with C- id
        prefixes. JSON contains // comments and is truncated to a sample.
  total_files: 15
  line_endings: crlf

layers:
  bronze:
    status: complete
    validation: sql/01_bronze/05_validate_bronze.sql   # 14 checks, all passing
    tables:
      raw_text_lines: 1701
      raw_client_a_customers: 23
      raw_client_a_orders: 21
      raw_client_a_products: 22
      raw_client_b_customers: 22
      raw_client_b_orders: 21
      raw_client_b_products: 18
      raw_client_b_payments: 21
  silver:
    status: complete
    validation: sql/02_silver/05_validate_rules.sql   # 55/55 rule coverage, both clients
    tables:
      transactions_clean: 46
      transaction_items_clean: 43
      customers_clean: 43
      products_clean: 37
      orders_clean: 40
      payments_clean: 20
      dq_quarantine: 131
  gold:
    status: complete
    validation: sql/03_gold/03_validate_canonical.sql # 29 invariants, all passing
    tables:
      dim_customer: 43
      dim_product: 37
      fact_order: 40
      fact_transaction: 46
      fact_order_item: 43
      fact_payment: 57

parsed_volumes:            # validated in Snowflake, not yet materialised
  client_a_transactions:
    total: 46
    distinct: 40
    duplicates: 6
  client_b_transactions:
    total: 11
    distinct: 10
    duplicates: 1

workflow:
  branching: feature/<short-description>
  commits: conventional
  review: /code-review on every PR before merge
  docs_policy: knowledge-base updated in the same PR as the code it describes

pull_requests:
  - number: 1
    title: bronze layer — raw ingestion of 15 multi-format source files
    scope: [setup, bronze]
    review_rounds: 4
    review_findings: 26
    review_confirmed: 22
    review_false_positives: 1
    review_rejected_as_disproportionate: 1
  - number: 8
    title: silver and gold — parsing, data quality, and the canonical model
    scope: [silver, gold, dashboard, docs]
    review_rounds: 3
    review_findings: 30
    review_confirmed: 30
    notable: >
      Found two defects that produced wrong figures without failing, after those
      figures had already been published: line items leaking between copies of a
      duplicated transaction (a phantom 91.00 variance on TXN-1001), and
      order_key derived unconditionally so 19 transactions referenced orders that
      were never created.

deliverables:
  raw_ingestion_ddl: sql/01_bronze/03_raw_ingestion_ddl.sql
  canonical_ddl: sql/03_gold/01_canonical_ddl.sql
  transformation_sql: [sql/02_silver/, sql/03_gold/02_transform_to_canonical.sql]
  anomaly_notes: docs/anomaly-handling.md
  dashboard: https://santiagov1998.github.io/financial-data-ingestion-snowflake/

last_updated: 2026-08-11
