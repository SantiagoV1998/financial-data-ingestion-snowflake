name: CI

on:
  pull_request:
  push:
    branches: [main]

# Neither job writes anything. On a repository whose default workflow
# permissions are still "read and write", omitting this hands both a token with
# scopes they never use.
permissions:
  contents: read

# Cancel superseded runs on the same branch — a PR that gets three pushes in a
# minute does not need three full CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-lint:
    name: SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned: an unpinned linter turns an unrelated release into a red build
      # on a PR that changed nothing.
      - name: Install SQLFluff
        run: pip install --disable-pip-version-check sqlfluff==4.3.0

      # github-annotation-native surfaces violations inline on the diff instead
      # of burying them in the log.
      - name: Lint SQL
        run: sqlfluff lint sql/ --format github-annotation-native

  source-integrity:
    name: Source files unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The central claim of this project is that the source files are ingested
      # byte-identical to delivery and every repair happens in SQL inside
      # Snowflake. These steps make that claim enforceable rather than asserted.
      #
      # The manifest alone cannot do it. CHECKSUMS.sha256 ships inside the PR,
      # so a PR that edits a source file AND regenerates the manifest satisfies
      # `shasum -c` perfectly — and GitHub would render a green check named
      # "Source files unmodified" on a PR that modified a source file. The
      # comparison against the base branch below is what actually closes it.
      - name: Verify checksums match the manifest
        run: shasum -a 256 -c data/CHECKSUMS.sha256

      # Guards the other half: `shasum -c` only verifies the paths the manifest
      # lists, so a file added to or deleted from data/ would pass unnoticed.
      # Compares sorted path lists rather than counts — counts are blind to a
      # rename or a typo that keeps the total the same, and `wc -l` would
      # miscount a manifest saved without a trailing newline.
      - name: Verify the manifest covers exactly the files present
        run: |
          diff <(find data -type f ! -name 'CHECKSUMS.sha256' | sort) \
               <(awk '{print $2}' data/CHECKSUMS.sha256 | sort) \
            || { echo "::error::data/ and CHECKSUMS.sha256 list different files"; exit 1; }

      # The real gate. Anything under data/ differing from the base branch fails,
      # including the manifest itself — so regenerating it cannot launder an
      # edit to a source file.
      - name: Verify data/ is unchanged relative to the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

          # A PR that introduces the manifest has nothing to compare against.
          if ! git cat-file -e FETCH_HEAD:data/CHECKSUMS.sha256 2>/dev/null; then
            echo "Manifest does not exist on ${{ github.base_ref }} yet — first run, nothing to compare."
            exit 0
          fi

          if ! git diff --quiet FETCH_HEAD -- data/; then
            echo "::error::data/ differs from ${{ github.base_ref }}. Source files are ingested as delivered and must not be edited; if a change is genuinely intended, it needs an explicit review of the diff below."
            git diff --stat FETCH_HEAD -- data/
            exit 1
          fi
          echo "data/ is identical to ${{ github.base_ref }}."
