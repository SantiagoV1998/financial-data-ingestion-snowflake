name: CI

on:
  pull_request:
  push:
    branches: [main]

# Neither job writes anything. On a repository whose default workflow
# permissions are still "read and write", omitting this hands both a token with
# scopes they never use.
permissions:
  contents: read

concurrency:
  # PRs group by ref so a new push supersedes the previous run. Pushes group by
  # SHA so they never share a group and can never cancel one another.
  #
  # cancel-in-progress alone is not enough: GitHub cancels *pending* runs in a
  # concurrency group regardless of that setting. With all pushes to main in one
  # group, three merges in quick succession would cancel the pending run for the
  # second — leaving that commit on main with a cancelled status and never
  # integrity-checked, and no later run covers it either, since step 3 on the
  # third merge compares against the second's tree rather than the last verified
  # commit.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sql-lint:
    name: SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned: an unpinned linter turns an unrelated release into a red build
      # on a PR that changed nothing.
      - name: Install SQLFluff
        run: pip install --disable-pip-version-check sqlfluff==4.3.0

      # github-annotation-native surfaces violations inline on the diff instead
      # of burying them in the log.
      - name: Lint SQL
        run: sqlfluff lint sql/ --format github-annotation-native

  source-integrity:
    name: Source files unmodified
    runs-on: ubuntu-latest
    steps:
      # Full history: computing a merge base is impossible from a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The central claim of this project is that the source files are ingested
      # byte-identical to delivery and every repair happens in SQL inside
      # Snowflake. These three steps make that claim enforceable rather than
      # asserted, and they are deliberately layered — each covers a way the
      # others can be defeated.
      #
      #   1. checksums    the 15 files match the manifest
      #   2. coverage     the manifest lists exactly the files present
      #   3. base diff    the files themselves are unchanged since the base
      #
      # Steps 1 and 2 cannot stand alone: the manifest ships inside the change,
      # so editing a source file and regenerating the manifest satisfies both.
      # Step 3 is what closes that, and it deliberately ignores the manifest —
      # comparing the source files directly means a regenerated manifest has
      # nothing to launder.
      # Pins the manifest itself. Steps 1-3 are otherwise all relative — either
      # to the manifest (which ships inside the change) or to the base branch.
      # That leaves one permanent laundering path: get a tampered file onto main
      # once, by a direct push, an admin merge over the red check, or a
      # force-push, and every later comparison is made against tampered main, so
      # all three steps report green forever while the single red build sits on
      # an already-merged commit. An absolute expected value closes it, and
      # updating it requires editing this workflow — which is exactly the policy
      # this gate enforces: exceptions belong in the diff.
      - name: 0 · Manifest itself is unchanged
        env:
          EXPECTED: '5fd518cbc9a62a56be4eb520adebbf152fd0c92bec4bbd6b559b9b62eda79e41'
        run: |
          actual=$(shasum -a 256 data/CHECKSUMS.sha256 | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::data/CHECKSUMS.sha256 has changed (expected $EXPECTED, got $actual). The source files are ingested as delivered; if a delivery genuinely changed, update EXPECTED in this workflow in the same PR so the exception is reviewed."
            exit 1
          fi
          echo "Manifest matches the pinned digest."

      - name: 1 · Checksums match the manifest
        run: shasum -a 256 -c data/CHECKSUMS.sha256

      # git ls-files, not find: find walks the working tree, so a gitignored
      # .DS_Store would be reported as an uncovered file.
      #
      # core.quotePath=false is required, not cosmetic. It defaults to true, and
      # git then C-quotes any path with non-ASCII bytes:
      # "data/client_a/Facturaci\303\263n.csv". The manifest is generated with
      # `ls-files -z`, which never quotes, so the two sides of this diff would
      # disagree on every accented filename — plausible for Spanish-language
      # client deliveries — and the gate would fail with no way to pass short of
      # renaming a source file, the one thing this project forbids.
      #
      # sed, not awk '{print $2}': the manifest format is `hash␠␠path`, and $2
      # truncates any path containing a space.
      #
      # grep -vx, anchored: unanchored, the '.' is a wildcard and a delivered
      # file merely containing that substring would be dropped from both sides.
      - name: 2 · Manifest covers exactly the files present
        run: |
          diff <(git -c core.quotePath=false ls-files data | grep -vx 'data/CHECKSUMS\.sha256' | sort) \
               <(sed 's/^[0-9a-f]\{64\}  //' data/CHECKSUMS.sha256 | sort) \
            || { echo "::error::data/ and CHECKSUMS.sha256 list different files"; exit 1; }

      # Steps 1 and 2 both derive from the git index, and so does the manifest,
      # so a delivered file that `git add` silently skips is invisible to all of
      # them — it never reaches Snowflake while CI reports green.
      #
      # This checks the .gitignore *properties*, not the presence of files. An
      # earlier version ran `git ls-files --others --ignored -- data/`, which
      # cannot work in CI: it lists untracked working-tree files, and a fresh
      # checkout has only tracked ones, so it passed unconditionally while the
      # blind spot stayed open.
      #
      # Both directions are tested, because the two failure modes are opposite
      # and fixing one has already caused the other:
      #   · a delivered format must never be ignorable — otherwise the next
      #     delivery vanishes silently (gitignore does not affect already-tracked
      #     files, so the damage only appears on the following delivery)
      #   · a credential must always stay ignored — a blanket `!data/**` once
      #     made .env, rsa_key.p8 and secrets.pem stageable in this public repo
      #
      # Real tracked paths are probed, not just synthetic names. A bare `*.xml`
      # would be caught by the synthetic probes too — but a directory-scoped
      # pattern such as `data/client_a/*.xml` shadows all seven
      # ClientA_Transactions fragments while every probe under
      # data/probe_client/ stays green. Only the real names catch that.
      - name: 2b · .gitignore protects deliveries and still blocks secrets
        run: |
          set -uo pipefail
          failed=0

          # check-ignore: 0 = ignored, 1 = not ignored, 128 = error.
          # 128 must not be read as "not ignored" — this is a fail-closed gate.
          probe() {
            git check-ignore --no-index -q "$1"
            case "$?" in
              0) echo ignored ;;
              1) echo visible ;;
              *) echo error ;;
            esac
          }

          # Every tracked delivery, by its real name, must stay visible.
          while IFS= read -r f; do
            case "$(probe "$f")" in
              ignored) echo "::error::.gitignore hides the delivered file $f — the next delivery of it would be invisible to every other check."; failed=1 ;;
              error)   echo "::error::git check-ignore failed on $f"; failed=1 ;;
            esac
          done < <(git -c core.quotePath=false ls-files data | grep -vx 'data/CHECKSUMS\.sha256')

          # Hypothetical deliveries in each delivered format must be stageable.
          # Nested paths included: git does not descend into an excluded
          # directory, so an unanchored pattern like `tmp/` swallows a delivery
          # unpacked into data/client_c/tmp/ and no `!data/**/*.ext` can rescue
          # it. Flat probes never exercise that.
          # One nested probe per anchored directory pattern. Covering only two of
          # the four left a hole: un-anchoring /.idea/ or /.vscode/ — a very
          # likely future edit — would swallow a delivery again while every
          # existing probe stayed green.
          for probe_file in Orders.csv Orders.CSV Transactions.xml transactions.json Transactions.txt \
                            tmp/Orders.csv .snowflake/Orders.csv .vscode/Orders.csv \
                            .idea/Orders.csv sub/dir/Orders.csv; do
            case "$(probe "data/probe_client/$probe_file")" in
              ignored) echo "::error::.gitignore would hide a delivered data/probe_client/$probe_file"; failed=1 ;;
              error)   echo "::error::git check-ignore failed on data/probe_client/$probe_file"; failed=1 ;;
            esac
          done

          # Credentials must stay ignored even carrying a data extension.
          # Mixed case throughout: gitignore has no case-insensitive flag and the
          # runner has core.ignorecase=false, so a lowercase-only guard leaves
          # Credentials.csv and CREDENTIALS.CSV committable — and Client B
          # already delivers Customer.CSV in uppercase.
          for secret in credentials.csv Credentials.csv CREDENTIALS.CSV \
                        api_secret.json API_SECRET.json auth_token.csv AuthToken.csv \
                        .env .env.local .ENV \
                        signing.key signing.KEY secrets.pem Secrets.PEM \
                        rsa_key.p8 rsa_key.csv rsa_key.txt RSA_KEY.txt \
                        private_key.txt Private_Key.txt; do
            case "$(probe "data/probe_client/$secret")" in
              visible) echo "::error::.gitignore would allow committing data/probe_client/$secret to a public repository."; failed=1 ;;
              error)   echo "::error::git check-ignore failed on data/probe_client/$secret"; failed=1 ;;
            esac
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "Deliveries stay visible; credentials stay ignored."

      # Runs on pushes too. Restricting this to pull_request would leave a
      # direct push to main verified only by steps 1 and 2 — which is precisely
      # the hole this step exists to close, relocated rather than fixed.
      # The exception is the workflow diff itself, and it is self-enforcing.
      #
      # Changing a source file requires regenerating the manifest, which changes
      # its digest, which fails step 0 unless EXPECTED is updated here — in this
      # file. So a legitimate re-delivery cannot avoid touching the workflow,
      # and this step keys on exactly that. The exception therefore lands where
      # a reviewer already has to look, and cannot be applied silently.
      #
      # Two earlier attempts at this failed and are worth recording. A
      # `data-change-approved` label could not work: applying a label does not
      # re-trigger `on: pull_request` (default types are
      # opened/synchronize/reopened), a re-run replays the original payload, and
      # push events have no labels at all — so merging an approved change left
      # main red with the diff that had just been approved. Deleting the label
      # and documenting "edit the workflow too" was no better: nothing in this
      # step read the workflow, so following the documented procedure still
      # could not turn CI green, and an admin merge reproduced the same red
      # main. Reading the workflow diff here is what makes the documented
      # remedy true.
      - name: 3 · Source files unchanged relative to the base
        env:
          # Passed through env rather than interpolated into the script. A branch
          # name may legally contain ';', '$', '&' or backticks, so ${{ }} inside
          # run: is a shell-injection surface for anyone with push access.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            # Merge base, not the base tip. actions/checkout gives the merge
            # ref, so in practice this collapses to the base tip today — but a
            # plain two-point diff would fail every open PR the moment data/
            # legitimately changed on main, naming files those PRs never
            # touched. The merge base is correct regardless of which ref is
            # checked out.
            base=$(git merge-base FETCH_HEAD HEAD)
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "::error::No previous commit to compare against on this push."
              exit 1
            fi
          fi

          # Fails closed. An earlier version treated "cannot compare" as success,
          # which meant any unreachable ref silently skipped the whole gate while
          # reporting green.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::Base commit $base is unreachable; refusing to report success without verifying."
            exit 1
          fi

          # The manifest is excluded on purpose: this step compares the source
          # files themselves, so regenerating the manifest cannot hide an edit.
          if git diff --quiet "$base" HEAD -- data/ ':(exclude)data/CHECKSUMS.sha256'; then
            echo "Source files under data/ are identical to the base."
            exit 0
          fi

          # data/ changed. Allowed only when the pinned digest changed with it.
          #
          # Branch protection makes this narrower but does not fully close it.
          # Force-pushes and deletions are rejected and both checks are required,
          # so nothing reaches main without passing CI. It does not guarantee a
          # reviewer saw the diff: with a single collaborator, requiring an
          # approval would freeze the branch, and requiring none does not block a
          # direct push — verified, a commit already carrying green checks was
          # accepted straight onto main. The exception is kept deliberately
          # narrow (the pinned digest must change in the same commit) but it is
          # enforced by discipline, not by GitHub. See knowledge-base/DECISIONS.md
          # D16.
          #
          # Keyed on the EXPECTED line specifically, not on "ci.yml changed at
          # all". The looser check coupled the exception to an unrelated edit —
          # bumping the SQLFluff version in the same PR would have waved a data
          # change through — and it would have become a silent bypass if
          # EXPECTED were ever moved to a repo variable or a separate file.
          # Captured into a variable rather than piped into `grep -q`: under
          # `set -o pipefail`, grep -q exits at the first match and closes the
          # pipe, so a large diff still being written dies on SIGPIPE (141) and
          # the whole condition inverts — rejecting a legitimate re-delivery
          # precisely because EXPECTED did change.
          workflow_diff=$(git diff -U0 "$base" HEAD -- .github/workflows/ci.yml)
          if printf '%s' "$workflow_diff" | grep -E "^[+-][[:space:]]*EXPECTED:" >/dev/null; then
            echo "::warning::Source files under data/ changed and the pinned digest was updated with them — treating this as a reviewed re-delivery. The diff below must be checked deliberately."
            git diff --stat "$base" HEAD -- data/ ':(exclude)data/CHECKSUMS.sha256'
            exit 0
          fi

          echo "::error::Source files under data/ differ from the base. They are ingested exactly as delivered and must not be edited."
          echo "If the content genuinely changed: regenerate data/CHECKSUMS.sha256 and update EXPECTED in this workflow in the same PR — that is what marks the change as reviewed."
          echo "If only the file MODE changed (chmod), revert it: the bytes are identical, so the manifest and its digest cannot change and the procedure above does not apply."
          git diff --stat "$base" HEAD -- data/ ':(exclude)data/CHECKSUMS.sha256'
          exit 1
